# Render blueprint. In the Render dashboard: New > Blueprint, point it at this
# repo, and it creates the web service and database together.
services:
  - type: web
    name: ledger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString

databases:
  - name: ledger-db
    plan: free
    databaseName: ledger
    user: ledger
